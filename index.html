<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piece of Pi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        svg#bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        svg#clock-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        /* Scrolling fact text */
        .fact-line {
            position: absolute;
            white-space: nowrap;
            font-family: 'Avenir Next', 'Avenir', 'Century Gothic', sans-serif;
            font-weight: 800;
            font-style: oblique;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 0.6em;
        }

        .fact-text-inner {
            pointer-events: none;
        }

        /* Parallelogram MORE INFO button - skewed to match oblique angle */
        .more-info-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.18em 0.9em;
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 6px;
            font-weight: 800;
            font-style: oblique;
            font-size: 0.55em;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            pointer-events: all;
            /* Skew matches oblique slant (~10 degrees) */
            transform: skewX(-10deg);
            white-space: nowrap;
            text-decoration: none;
            flex-shrink: 0;
            transition: background 0.2s, color 0.2s;
        }

        .more-info-btn:hover {
            background: #fff;
            color: #000;
        }

        /* Counter-skew the text inside so it reads straight */
        .more-info-btn span {
            display: inline-block;
            transform: skewX(10deg);
        }

        /* Pi Day overlay */
        #piday-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 20;
            pointer-events: none;
            display: none;
        }

        #bouncing-pi {
            position: absolute;
            font-family: Georgia, serif;
            font-weight: bold;
            line-height: 1;
        }
    </style>
</head>
<body>
<div class="container" id="container">

    <!-- Background: two-zone mathematical horizon -->
    <svg id="bg" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Top zone gradient (1 unit tall) - dark top, white at horizon -->
            <linearGradient id="grad-sky" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
                <stop offset="0%"   stop-color="#2a2a2a"/>
                <stop offset="100%" stop-color="#ffffff"/>
            </linearGradient>
            <!-- Bottom zone gradient (π units tall) - white at horizon, dark bottom -->
            <linearGradient id="grad-ground" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
                <stop offset="0%"   stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#2a2a2a"/>
            </linearGradient>
        </defs>
        <rect id="sky-rect"    x="0" y="0" width="100%" height="50%" fill="url(#grad-sky)"/>
        <rect id="ground-rect" x="0" y="50%" width="100%" height="50%" fill="url(#grad-ground)"/>
    </svg>

    <!-- Clock SVG -->
    <svg id="clock-svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="clock-shadow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="28" result="blur"/>
                <feComponentTransfer in="blur" result="shadow">
                    <feFuncA type="linear" slope="0.6"/>
                </feComponentTransfer>
                <feMerge>
                    <feMergeNode in="shadow"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>
        <g id="pie"></g>
    </svg>

    <!-- Fact text layer -->
    <div id="fact-layer" style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;"></div>

    <!-- Pi Day easter egg -->
    <div id="piday-overlay">
        <span id="bouncing-pi">π</span>
    </div>

</div>
<script>
    // ─── Constants ───────────────────────────────────────────────
    const PI     = Math.PI;
    const RATIO  = PI;          // bottom zone is π × top zone
    const TOTAL  = 1 + RATIO;   // 4.14159...
    const SKY_FRAC    = 1 / TOTAL;      // ~0.2416  (top zone fraction)
    const GROUND_FRAC = RATIO / TOTAL;  // ~0.7584  (bottom zone fraction)

    // ─── Facts ───────────────────────────────────────────────────
    const PI_FACTS_RAW = [
        "Pi is the ratio of a circle's circumference to its diameter.",
        "The symbol π was first used by William Jones in 1706.",
        "Pi is an irrational number — it never repeats or terminates.",
        "Archimedes calculated pi to be between 3.1408 and 3.1429.",
        "Pi is transcendental — it cannot be the root of any polynomial equation.",
        "The first million digits of pi were calculated by 1973.",
        "Pi Day is celebrated on March 14th (3/14) every year.",
        "Pi to 39 decimal places can calculate the universe's circumference to within a hydrogen atom's width.",
        "Zu Chongzhi calculated pi to 7 decimal places in the 5th century — a record that stood for 900 years.",
        "The word pi comes from the Greek letter π, first letter of the word perimetros.",
        "Pi appears in the formula for a normal distribution in statistics.",
        "Albert Einstein was born on Pi Day — March 14, 1879.",
        "Pi has been calculated to over 100 trillion decimal places.",
        "The first recorded use of a symbol for pi was by William Oughtred in 1647.",
        "Pi is used in navigation, engineering, physics, and virtually every branch of science.",
        "The probability that two randomly chosen integers are coprime is 6 divided by pi squared.",
        "Ludolph van Ceulen spent his life calculating pi to 35 digits — engraved on his tombstone.",
        "Pi appears in Euler's famous identity: e to the power of i-pi plus 1 equals 0.",
        "The digits of pi pass all known tests for statistical randomness.",
        "Ramanujan discovered remarkable formulas for pi in the early 20th century, some still used today.",
        "Pi is used in Fourier transforms, which underpin digital audio and image compression.",
        "The Great Pyramid of Giza has a perimeter-to-height ratio close to 2π.",
        "Pi appears in Heisenberg's uncertainty principle in quantum mechanics.",
        "The first computer calculation of pi was performed in 1949 using ENIAC — 2037 digits in 70 hours.",
        "Pi is intimately connected to the geometry of circles, spheres, and all curved surfaces.",
        "The Chudnovsky brothers calculated 4 billion digits of pi on a homemade supercomputer in 1994.",
        "Pi is used to calculate the orbital periods of planets.",
        "There are no repeating patterns known in the digits of pi.",
        "Pi is hidden in the formula for Coulomb's Law, describing the force between electric charges.",
        "The number 3.14159 was known as the constant of the circle for centuries.",
        "Pi appears in the formula for gravitational waves detected by LIGO.",
        "Memorising pi digits is a competitive sport — the world record exceeds 70,000 digits.",
        "The Basel problem solved by Euler in 1734 showed 1 plus 1/4 plus 1/9 plus ... equals pi squared over 6.",
        "Pi appears in the formula for the area of an ellipse.",
        "The circumference of the Earth is approximately 2π times 6371 kilometres.",
        "Pi is used in signal processing to describe sine and cosine waves.",
        "The Leibniz formula for pi converges so slowly it is nearly useless for computation.",
        "Pi appears in Einstein's field equations of general relativity.",
        "The Indian mathematician Madhava calculated pi to 11 decimal places around 1400 AD.",
        "Pi is used in GPS calculations to find positions on the curved surface of the Earth.",
        "There are no occurrences of 123456 in the first million digits of pi.",
        "The Gaussian integral, fundamental to probability, equals the square root of pi.",
        "Pi was first called π because it is the first letter of periphery and perimeter.",
        "A rational approximation of pi, 355 over 113, is accurate to 6 decimal places.",
        "Pi shows up in the solution to Buffon's needle problem in probability theory.",
        "The area of a circle of radius 1 is exactly pi.",
        "Pi appears in the formula for the volume of a torus.",
        "Supercomputers have used pi calculation as a benchmark test of accuracy and speed.",
        "The sequence 0123456789 first appears at position 17 billion in the digits of pi.",
        "Pi is used in antenna design, acoustic engineering, and electromagnetic theory.",
        "The ratio of pi to Euler's number is approximately 1.1557.",
        "Pi appears in the formula relating a pendulum's length to its period of oscillation.",
        "The Machin formula discovered in 1706 was used to compute pi for centuries.",
        "Pi is used in the mathematical description of all circular and rotational motion.",
        "The digit sequence 999999 appears at position 762 in pi — known as the Feynman Point.",
        "Pi appears in Stirling's approximation for factorials.",
        "The 100th digit of pi is 9.",
        "Pi shows up in the formula for the surface area of a sphere: 4 pi r squared.",
        "Napoleon is rumoured to have been interested in pi — though historians debate this.",
        "There are more digits of pi than there are atoms in the observable universe.",
        "Pi cannot be expressed as a fraction — proved by Lambert in 1761.",
        "The first 144 digits of pi add up to 666.",
        "Pi appears in the Wallis product, an infinite series of fractions converging to pi over 2.",
        "The Egyptians approximated pi as 256 over 81, roughly 3.16, around 1650 BC.",
        "Pi shows up in the formula for black hole entropy in Hawking's thermodynamics.",
        "The digits of pi contain every possible finite number sequence — at least in theory.",
        "Pi is used to calculate the resonant frequencies of musical instruments.",
        "Archimedes was the first to rigorously approximate pi using a 96-sided polygon.",
        "The number of seconds in a year is approximately pi times ten to the power of seven.",
        "Pi appears in the formula for the deflection of starlight around massive objects.",
        "Pi is connected to the Riemann zeta function at even positive integers.",
        "The Monte Carlo method can estimate pi using random points in a square and circle.",
    ];

    // Pad to 1440
    const PI_FACTS = [];
    while (PI_FACTS.length < 1440) {
        PI_FACTS.push(PI_FACTS_RAW[PI_FACTS.length % PI_FACTS_RAW.length]);
    }

    // Tonal greys only — 24 distinct shades cycling through hours
    const FACT_COLORS = [
        '#1a1a1a','#222','#2a2a2a','#333',
        '#3a3a3a','#444','#4a4a4a','#555',
        '#5a5a5a','#666','#6a6a6a','#777',
        '#888','#999','#aaa','#bbb',
        '#999','#888','#777','#666',
        '#555','#444','#333','#222',
    ];

    // ─── Layout ──────────────────────────────────────────────────
    function getLayout() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const horizonY = vh * SKY_FRAC;         // ~24% from top
        const isPortrait = vh > vw;
        const backW = vw * 0.5;
        const backH = vh * 0.5;
        const diam = isPortrait ? backH * 1.1 : backW * 1.1;
        return {
            vw, vh,
            horizonY,
            cx: vw / 2,
            cy: vh / 2,
            radius: diam / 2,
            // Text sits same distance from bottom as horizon from top
            textY: vh - horizonY,
        };
    }

    // ─── Background ──────────────────────────────────────────────
    function drawBackground() {
        const { vh, horizonY } = getLayout();
        document.getElementById('sky-rect').setAttribute('height', horizonY);
        document.getElementById('ground-rect').setAttribute('y', horizonY);
        document.getElementById('ground-rect').setAttribute('height', vh - horizonY);
    }

    // ─── Clock ───────────────────────────────────────────────────
    function drawClock() {
        const { cx, cy, radius } = getLayout();
        const now      = new Date();
        const hours    = now.getHours();
        const minutes  = now.getMinutes();

        const totalMins = ((hours % 12) * 60) + minutes;
        const angle     = (totalMins / 720) * 360;
        const isAM      = hours < 12;

        const bgColor    = isAM ? '#111' : '#efefef';
        const sliceColor = isAM ? '#efefef' : '#111';
        const tickColor  = isAM ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.2)';

        const pie = document.getElementById('pie');
        pie.innerHTML = '';

        // Plain group — no filter, no shadow
        const g = document.createElementNS('http://www.w3.org/2000/svg','g');

        // Base circle
        const bg = document.createElementNS('http://www.w3.org/2000/svg','circle');
        bg.setAttribute('cx', cx);
        bg.setAttribute('cy', cy);
        bg.setAttribute('r',  radius);
        bg.setAttribute('fill', bgColor);
        g.appendChild(bg);

        // Pie slice
        if (angle > 0 && angle < 360) {
            const sRad = -PI / 2;
            const eRad = sRad + (angle * PI / 180);
            const x1 = cx + radius * Math.cos(sRad);
            const y1 = cy + radius * Math.sin(sRad);
            const x2 = cx + radius * Math.cos(eRad);
            const y2 = cy + radius * Math.sin(eRad);
            const la = angle > 180 ? 1 : 0;

            const sl = document.createElementNS('http://www.w3.org/2000/svg','path');
            sl.setAttribute('d', `M ${cx},${cy} L ${x1},${y1} A ${radius},${radius} 0 ${la},1 ${x2},${y2} Z`);
            sl.setAttribute('fill', sliceColor);
            g.appendChild(sl);
        }

        pie.appendChild(g);

        // Hour ticks on top
        for (let i = 0; i < 12; i++) {
            const tRad   = (i / 12) * 2 * PI - PI / 2;
            const outerR = radius * 0.92;
            const innerR = radius * 0.78;
            const tx1 = cx + outerR * Math.cos(tRad);
            const ty1 = cy + outerR * Math.sin(tRad);
            const tx2 = cx + innerR * Math.cos(tRad);
            const ty2 = cy + innerR * Math.sin(tRad);

            const tick = document.createElementNS('http://www.w3.org/2000/svg','line');
            tick.setAttribute('x1', tx1); tick.setAttribute('y1', ty1);
            tick.setAttribute('x2', tx2); tick.setAttribute('y2', ty2);
            tick.setAttribute('stroke', tickColor);
            tick.setAttribute('stroke-width', radius * 0.012);
            tick.setAttribute('stroke-linecap', 'round');
            pie.appendChild(tick);
        }
    }

    // ─── Scrolling fact ──────────────────────────────────────────
    let scrollAnimation = null;

    function startScroll() {
        const now     = new Date();
        const hours   = now.getHours();
        const minutes = now.getMinutes();
        const hh = String(hours).padStart(2,'0');
        const mm = String(minutes).padStart(2,'0');
        const factIndex = hours * 60 + minutes;
        const fact  = PI_FACTS[factIndex];
        const color = FACT_COLORS[hours % 24];
        const { vh, horizonY, vw } = getLayout();

        const textBottom = horizonY;
        const fontSize   = Math.max(14, vh * 0.028 * 1.5);

        const layer = document.getElementById('fact-layer');
        layer.innerHTML = '';

        // Outer scrolling container - flex row with text + button
        const el = document.createElement('div');
        el.className = 'fact-line';
        el.style.fontSize   = fontSize + 'px';
        el.style.color      = color;
        el.style.bottom     = textBottom + 'px';
        el.style.lineHeight = '1';

        // Text portion
        const textSpan = document.createElement('span');
        textSpan.className = 'fact-text-inner';
        textSpan.textContent = `${hh}:${mm}          FACT #${factIndex}:  ${fact.toUpperCase()}     `;
        el.appendChild(textSpan);

        // MORE INFO button — opens Google search of the fact
        const btn = document.createElement('a');
        btn.className = 'more-info-btn';
        btn.href = `https://www.google.com/search?q=${encodeURIComponent(fact)}`;
        btn.target = '_blank';
        btn.rel = 'noopener noreferrer';
        const btnLabel = document.createElement('span');
        btnLabel.textContent = 'MORE INFO';
        btn.appendChild(btnLabel);
        el.appendChild(btn);

        // Trailing space after button
        const trail = document.createElement('span');
        trail.className = 'fact-text-inner';
        trail.textContent = '               ';
        el.appendChild(trail);

        layer.appendChild(el);

        if (scrollAnimation) {
            cancelAnimationFrame(scrollAnimation);
            scrollAnimation = null;
        }

        requestAnimationFrame(() => {
            const tw      = el.offsetWidth;
            const startX  = vw;
            const endX    = -tw;
            const dist    = startX - endX;
            const duration = 30000;
            const t0 = performance.now();

            function animate(now) {
                const p = (now - t0) / duration;
                if (p >= 1) { startScroll(); return; }
                el.style.transform = `translateX(${startX - p * dist}px)`;
                scrollAnimation = requestAnimationFrame(animate);
            }
            scrollAnimation = requestAnimationFrame(animate);
        });
    }

    // ─── Pi Day easter egg ───────────────────────────────────────
    let bouncingAnim = null;
    let bounce = { x: 100, y: 100, vx: 4, vy: 3, ci: 0 };

    function isPiMinute() {
        const n = new Date();
        return n.getMonth() === 2 && n.getDate() === 14 &&
               n.getHours() % 12 === 3 && n.getMinutes() === 14;
    }

    function startEasterEgg() {
        document.getElementById('piday-overlay').style.display = 'block';
        document.getElementById('fact-layer').style.display = 'none';
        if (scrollAnimation) { cancelAnimationFrame(scrollAnimation); scrollAnimation = null; }

        const piEl = document.getElementById('bouncing-pi');
        const sz   = window.innerHeight * 0.22;
        piEl.style.fontSize = sz + 'px';
        bounce.x = 80; bounce.y = 80;
        bounce.vx = 4 + Math.random() * 2;
        bounce.vy = 3 + Math.random() * 2;
        let frame = 0;

        function tick() {
            const vw = window.innerWidth, vh = window.innerHeight;
            bounce.x += bounce.vx; bounce.y += bounce.vy;
            if (bounce.x <= 0 || bounce.x + sz >= vw) { bounce.vx *= -1; bounce.x = Math.max(0, Math.min(bounce.x, vw - sz)); }
            if (bounce.y <= 0 || bounce.y + sz >= vh) { bounce.vy *= -1; bounce.y = Math.max(0, Math.min(bounce.y, vh - sz)); }
            if (++frame % 30 === 0) bounce.ci = (bounce.ci + 1) % FACT_COLORS.length;
            piEl.style.left  = bounce.x + 'px';
            piEl.style.top   = bounce.y + 'px';
            piEl.style.color = FACT_COLORS[bounce.ci];
            bouncingAnim = requestAnimationFrame(tick);
        }
        bouncingAnim = requestAnimationFrame(tick);
    }

    function stopEasterEgg() {
        if (bouncingAnim) { cancelAnimationFrame(bouncingAnim); bouncingAnim = null; }
        document.getElementById('piday-overlay').style.display = 'none';
        document.getElementById('fact-layer').style.display = 'block';
    }

    // ─── Init & loops ────────────────────────────────────────────
    function init() {
        drawBackground();
        drawClock();
        if (isPiMinute()) { startEasterEgg(); }
        else { stopEasterEgg(); startScroll(); }
    }

    init();
    setInterval(drawClock, 1000);
    window.addEventListener('resize', init);
</script>
</body>
</html>
