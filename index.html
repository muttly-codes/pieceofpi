    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            padding: 2rem;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #pi-display {
            color: #000000;
            font-weight: 400;
            text-align: center;
            line-height: 1.6;
            word-break: break-all;
            position: relative;
            transition: font-size 0.5s ease-out, border-radius 2s ease-out;
        }

        .new-digit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(3);
            font-weight: 700;
            animation: fadeIn 3600s linear forwards, scaleDown 2s ease-out 3598s forwards;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0.05;
            }
            100% {
                opacity: 1;
            }
        }

        @keyframes scaleDown {
            0% {
                transform: translate(-50%, -50%) scale(3);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }

        .joining {
            animation: joinPi 0.8s ease-out forwards;
            display: inline-block;
        }

        @keyframes joinPi {
            0% {
                transform: scale(1.5);
                color: #000000;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                color: #000000;
            }
        }

        /* Info overlay */
        .info {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #999;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body:hover .info {
            opacity: 1;
        }

        .digit-count {
            font-weight: 700;
            color: #666;
        }

        /* SEO: Visually hidden but accessible to screen readers and search engines */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

</head>
<body>
    <h1 class="sr-only">Piece of Pi - An Infinite Visualization of Pi Revealing One Digit Every Hour</h1>
    <main role="main" aria-label="Pi visualization">
        <div class="container">
            <div id="pi-display" role="img" aria-label="Current digits of pi being displayed"></div>
        </div>
        
        <aside class="info" role="complementary" aria-label="Pi digit statistics">
            <div>Digit <span class="digit-count" id="count" aria-live="polite">1</span> of π</div>
            <div style="margin-top: 0.5rem;">Next digit in <span id="timer" aria-live="polite">59:59</span></div>
        </aside>
    </main>

    <script>
        // First 1000 digits of pi (after the decimal point)
        const PI_DIGITS = "1415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679821480865132823066470938446095505822317253594081284811174502841027019385211055596446229489549303819644288109756659334461284756482337867831652712019091456485669234603486104543266482133936072602491412737245870066063155881748815209209628292540917153643678925903600113305305488204665213841469519415116094330572703657595919530921861173819326117931051185480744623799627495673518857527248912279381830119491298336733624406566430860213949463952247371907021798609437027705392171762931767523846748184676694051320005681271452635608277857713427577896091736371787214684409012249534301465495853710507922796892589235420199561121290219608640344181598136297747713099605187072113499999983729780499510597317328160963185950244594553469083026425223082533446850352619311881710100031378387528865875332083814206171776691473035982534904287554687311595628638823537875937519577818577805321712268066130019278766111959092164201989";

        let currentIndex = 0;
        let piString = "3.";
        let startTime = Date.now();

        const piDisplay = document.getElementById('pi-display');
        const countDisplay = document.getElementById('count');
        const timerDisplay = document.getElementById('timer');

        function updatePiDisplay() {
            piDisplay.textContent = piString;
            updateFontSize();
            updateCircleShape();
        }

        function updateFontSize() {
            const digitCount = piString.length;
            let fontSize;
            
            if (digitCount < 10) {
                fontSize = 120;
            } else if (digitCount < 50) {
                fontSize = Math.max(80, 120 - (digitCount - 10) * 1);
            } else if (digitCount < 200) {
                fontSize = Math.max(40, 80 - (digitCount - 50) * 0.3);
            } else {
                fontSize = Math.max(20, 40 - (digitCount - 200) * 0.05);
            }
            
            piDisplay.style.fontSize = fontSize + 'px';
        }

        function updateCircleShape() {
            const digitCount = piString.length;
            let borderRadius = 0;
            
            if (digitCount > 50) {
                const progress = Math.min((digitCount - 50) / 200, 1);
                borderRadius = progress * 50;
            }
            
            piDisplay.style.borderRadius = borderRadius + '%';
            piDisplay.style.padding = digitCount > 50 ? '2rem' : '0';
        }

        function addNewDigit() {
            if (currentIndex >= PI_DIGITS.length) {
                return; // We've run out of digits
            }

            const newDigit = PI_DIGITS[currentIndex];
            
            // Create the spotlight digit
            const digitElement = document.createElement('div');
            digitElement.className = 'new-digit';
            digitElement.textContent = newDigit;
            digitElement.style.fontSize = piDisplay.style.fontSize;
            document.querySelector('.container').appendChild(digitElement);

            // After the animation completes, add digit to pi string
            setTimeout(() => {
                // Remove the spotlight element
                digitElement.remove();
                
                // Add to pi string with joining animation
                const span = document.createElement('span');
                span.className = 'joining';
                span.textContent = newDigit;
                
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = piDisplay.innerHTML + span.outerHTML;
                piDisplay.innerHTML = tempDiv.innerHTML;
                
                piString += newDigit;
                
                // Update the actual display after animation
                setTimeout(() => {
                    updatePiDisplay();
                    currentIndex++;
                    countDisplay.textContent = currentIndex + 1;
                }, 800);
                
            }, 3600000); // 1 hour = 3600000ms

            // For demo purposes, you can change this to a shorter time like 5000 (5 seconds)
            // }, 5000);
        }

        function updateTimer() {
            const elapsed = Date.now() - startTime;
            const hourInMs = 3600000;
            const remaining = hourInMs - (elapsed % hourInMs);
            
            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
            
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Initialize
        updatePiDisplay();
        addNewDigit();

        // Update timer every second
        setInterval(updateTimer, 1000);

        // Add a new digit every hour
        setInterval(addNewDigit, 3600000);
        // For demo: setInterval(addNewDigit, 5000);
    </script>
</body>
