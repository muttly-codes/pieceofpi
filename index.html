    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            padding: 2rem;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #pi-display {
            color: #000000;
            font-weight: 400;
            text-align: center;
            line-height: 1.6;
            word-break: break-all;
            position: relative;
            transition: font-size 0.5s ease-out, border-radius 2s ease-out, 
                        width 2s ease-out, height 2s ease-out, 
                        background-color 2s ease-out, transform 3s ease-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Spiral animation - applied when circle is complete */
        @keyframes spiral {
            0% {
                transform: rotate(0deg) scale(1);
            }
            100% {
                transform: rotate(720deg) scale(0.3);
            }
        }

        .new-digit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 700;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.3s ease-out;
            /* Responsive sizing - max 90% of viewport, accounting for "...X" being ~4 characters */
            font-size: min(22.5vh, 22.5vw); /* 90vw / 4 chars = 22.5vw per char */
            white-space: nowrap;
        }

        .joining {
            animation: joinPi 0.8s ease-out forwards;
            display: inline-block;
        }

        @keyframes joinPi {
            0% {
                transform: scale(1.5);
                color: #000000;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                color: #000000;
            }
        }

        /* Info overlay */
        .info {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #999;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body:hover .info {
            opacity: 1;
        }

        .digit-count {
            font-weight: 700;
            color: #666;
        }

<body>
    <h1 class="sr-only">Piece of Pi - An Infinite Visualization of Pi Revealing One Digit Every Hour</h1>
    <main role="main" aria-label="Pi visualization">
        <div class="container">
            <div id="pi-display" role="img" aria-label="Current digits of pi being displayed"></div>
        </div>
        
        <aside class="info" role="complementary" aria-label="Pi digit statistics">
            <div>Digit <span class="digit-count" id="count" aria-live="polite">1</span> of π</div>
            <div style="margin-top: 0.5rem;">Next digit in <span id="timer" aria-live="polite">--:--</span></div>
        </aside>
    </main>

    <script>
        // CORRECT digits of pi (after the decimal point) - from the PDF
        const PI_DIGITS = "1415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679821480865132823066470938446095505822317253594081284811174502841027019385211055596446229489549303819644288109756659334461284756482337867831652712019091456485669234603486104543266482133936072602491412737245870066063155881748815209209628292540917153643678925903600113305305488204665213841469519415116094330572703657595919530921861173819326117931051185480744623799627495673518857527248912279381830119491298336733624406566430860213949463952247371907021798609437027705392171762931767523846748184676694051320005681271452635608277857713427577896091736371787214684409012249534301465495853710507922796892589235420199561121290219608640344181598136297747713099605187072113499999983729780499510597317328160963185950244594553469083026425223082533446850352619311881710100031378387528865875332083814206171776691473035982534904287554687311595628638823537875937519577818577805321712268066130019278766111959092164201989";

        // FIXED LAUNCH DATE - January 30, 2026 at 10:00 AM Melbourne time (AEDT = UTC+11)
        // This is when the site first went live
        const LAUNCH_TIMESTAMP = new Date('2026-01-30T10:00:00+11:00').getTime();

        const piDisplay = document.getElementById('pi-display');
        const countDisplay = document.getElementById('count');
        const timerDisplay = document.getElementById('timer');
        
        let currentDigitElement = null;

        function calculateCurrentState() {
            const now = Date.now();
            const hoursSinceLaunch = Math.floor((now - LAUNCH_TIMESTAMP) / 3600000); // 3600000ms = 1 hour
            
            // Calculate which digit we should be on
            const digitIndex = Math.max(0, Math.min(hoursSinceLaunch, PI_DIGITS.length - 1));
            
            // Build the pi string up to the current digit
            let piString = "3." + PI_DIGITS.substring(0, digitIndex);
            
            // Calculate time until next digit
            const nextDigitTime = LAUNCH_TIMESTAMP + ((digitIndex + 1) * 3600000);
            const timeUntilNext = nextDigitTime - now;
            
            return {
                piString,
                digitIndex,
                timeUntilNext,
                currentDigit: PI_DIGITS[digitIndex] || null,
                nextDigit: PI_DIGITS[digitIndex + 1] || null
            };
        }

        function updateDisplay() {
            const state = calculateCurrentState();
            
            // Update the pi display with trailing ellipsis if there's a next digit coming
            let displayText = state.piString;
            if (state.nextDigit) {
                displayText += '...';
            }
            piDisplay.textContent = displayText;
            
            updateFontSize(state.piString);
            updateCircleShape(state.piString);
            
            // Update digit count
            countDisplay.textContent = state.digitIndex + 1;
            
            // Show the "next digit" overlay if we're within the hour
            if (state.nextDigit && state.timeUntilNext > 0 && state.timeUntilNext <= 3600000) {
                showNextDigit(state.nextDigit, state.timeUntilNext);
            }
        }

        function showNextDigit(digit, timeRemaining) {
            // Remove old digit element if it exists
            if (currentDigitElement) {
                currentDigitElement.remove();
            }
            
            // Create new digit element with leading ellipsis
            currentDigitElement = document.createElement('div');
            currentDigitElement.className = 'new-digit';
            currentDigitElement.textContent = '...' + digit;
            
            // Calculate opacity based on time remaining (fade in over the hour)
            const progress = 1 - (timeRemaining / 3600000); // 0 to 1
            const opacity = 0.05 + (progress * 0.95); // 0.05 to 1.0
            currentDigitElement.style.opacity = opacity;
            
            document.querySelector('.container').appendChild(currentDigitElement);
        }

        function updateFontSize(piString) {
            const digitCount = piString.length;
            let fontSize;
            
            if (digitCount < 10) {
                fontSize = 120;
            } else if (digitCount < 30) {
                fontSize = Math.max(60, 120 - (digitCount - 10) * 3);
            } else if (digitCount < 100) {
                fontSize = Math.max(24, 60 - (digitCount - 30) * 0.5);
            } else if (digitCount < 300) {
                fontSize = Math.max(14, 24 - (digitCount - 100) * 0.05);
            } else {
                fontSize = Math.max(10, 14 - (digitCount - 300) * 0.01);
            }
            
            piDisplay.style.fontSize = fontSize + 'px';
        }

        function updateCircleShape(piString) {
            const digitCount = piString.length;
            let borderRadius = 0;
            let padding = '0';
            let width = 'auto';
            let height = 'auto';
            let backgroundColor = 'transparent';
            
            // Start forming circle after 30 digits
            if (digitCount > 30 && digitCount <= 150) {
                const progress = Math.min((digitCount - 30) / 120, 1); // Full circle by 150 digits
                borderRadius = progress * 50;
                
                // Create a fixed circular container
                if (digitCount > 40) {
                    const size = Math.min(300 + (digitCount * 2), 800); // Grow from 300px to 800px max
                    width = size + 'px';
                    height = size + 'px';
                    padding = '3rem';
                    
                    // Very subtle background to show the circle (nearly invisible)
                    const bgOpacity = Math.min(progress * 0.03, 0.03);
                    backgroundColor = `rgba(0, 0, 0, ${bgOpacity})`;
                }
            }
            // SPIRAL PHASE: After circle is complete (150+ digits)
            else if (digitCount > 150) {
                borderRadius = 50; // Keep it circular
                
                // Calculate spiral progression
                const spiralProgress = (digitCount - 150) / 200; // Spiral over next 200 digits
                const rotations = Math.min(spiralProgress * 10, 10); // Up to 10 full rotations
                const scale = Math.max(0.1, 1 - (spiralProgress * 0.9)); // Shrink to 10% of original
                
                // Apply spiral transformation
                piDisplay.style.transform = `rotate(${rotations * 360}deg) scale(${scale})`;
                
                // Size gets smaller as it spirals
                const size = Math.max(100, 600 - (spiralProgress * 500));
                width = size + 'px';
                height = size + 'px';
                padding = '2rem';
                
                backgroundColor = `rgba(0, 0, 0, 0.03)`;
            }
            
            piDisplay.style.borderRadius = borderRadius + '%';
            piDisplay.style.padding = padding;
            piDisplay.style.width = width;
            piDisplay.style.height = height;
            piDisplay.style.backgroundColor = backgroundColor;
        }

        function updateTimer() {
            const state = calculateCurrentState();
            
            if (state.timeUntilNext <= 0) {
                timerDisplay.textContent = '00:00';
                // Refresh display when new digit should appear
                updateDisplay();
            } else {
                const minutes = Math.floor(state.timeUntilNext / 60000);
                const seconds = Math.floor((state.timeUntilNext % 60000) / 1000);
                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }

        // Initialize
        updateDisplay();
        updateTimer();

        // Update timer every second
        setInterval(updateTimer, 1000);

        // Update display every minute (in case we need to add a new digit)
        setInterval(updateDisplay, 60000);
    </script>
