<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piece of Pi</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #f5f5f5;
            font-family: 'Roboto Mono', monospace;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Ticker container - 16% height, sits 42% from top */
        .ticker-container {
            position: absolute;
            top: 42%;
            left: 0;
            width: 100%;
            height: 16%;
            overflow: hidden;
            z-index: 10;
            pointer-events: none;
        }

        /* Cylindrical bars - FIX: 3x thicker = 9% each */
        .ticker-bar-top {
            position: absolute;
            top: 0;
            width: 100%;
            height: 9%;
            background: linear-gradient(to bottom,
                #f0f0f0 0%,
                #e0e0e0 10%,
                #aaa 30%,
                #666 50%,
                #aaa 70%,
                #e0e0e0 90%,
                #f0f0f0 100%
            );
        }

        .ticker-bar-bottom {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 9%;
            background: linear-gradient(to bottom,
                #f0f0f0 0%,
                #e0e0e0 10%,
                #aaa 30%,
                #666 50%,
                #aaa 70%,
                #e0e0e0 90%,
                #f0f0f0 100%
            );
        }

        /* Text area between bars */
        .ticker-text {
            position: absolute;
            top: 9%;
            width: 100%;
            height: 82%;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        /* FIX: 2x font size (was 4vh, now 8vh)
           FIX: scroll speed 3x slower (was 20s, now 60s)
           FIX: single pass - start at 100vw, end at -100% of text width
           We use JS-driven animation so the text completes exactly once per cycle */
        .fact-scroll {
            display: inline-block;
            white-space: nowrap;
            font-size: 8vh;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            position: absolute;
            left: 0;
            text-shadow: 
                2px 2px 6px rgba(0, 0, 0, 0.6),
                0px 0px 12px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="main-svg" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- FIX: Top = darkest, Bottom = lightest, Left/Right = mid -->
                <linearGradient id="grad-top" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#555;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#d5d5d5;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad-left" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#777;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#aaa;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad-right" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#aaa;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#777;stop-opacity:1" />
                </linearGradient>
            </defs>

            <g id="box"></g>
            <g id="pie"></g>
            <g id="pi-symbol"></g>
        </svg>

        <div class="ticker-container">
            <div class="ticker-bar-top"></div>
            <div class="ticker-text">
                <span class="fact-scroll" id="fact-text"></span>
            </div>
            <div class="ticker-bar-bottom"></div>
        </div>
    </div>

    <script>
        // FIX: Fact number = total minutes since midnight (0-1439)
        // 00:00 = fact 0, 01:00 = fact 60, 01:01 = fact 61, 23:59 = fact 1439
        const PI_FACTS = [
            // 00:xx - Fact 0-59
            "Pi is the ratio of a circle's circumference to its diameter.",
            "The symbol π was first used by William Jones in 1706.",
            "Pi is an irrational number — it never repeats or terminates.",
            "Archimedes calculated pi to be between 3.1408 and 3.1429.",
            "Pi is transcendental — it cannot be the root of any polynomial equation.",
            "The first million digits of pi were calculated by 1973.",
            "Pi Day is celebrated on March 14th (3/14) every year.",
            "The value of pi to 39 decimal places is enough to calculate the circumference of the universe to within the width of a hydrogen atom.",
            "Zu Chongzhi calculated pi to 7 decimal places in the 5th century — a record that stood for 900 years.",
            "The word 'pi' comes from the Greek letter π, the first letter of the Greek word 'perimetros'.",
            "Pi appears in the formula for a normal distribution in statistics.",
            "Albert Einstein was born on Pi Day — March 14, 1879.",
            "Pi has been calculated to over 100 trillion decimal places.",
            "The first recorded use of a symbol for pi was by William Oughtred in 1647.",
            "Pi is used in navigation, engineering, physics, and virtually every branch of science.",
            "The probability that two randomly chosen integers are coprime is 6/π².",
            "Ludolph van Ceulen spent much of his life calculating pi to 35 digits — these digits were engraved on his tombstone.",
            "Pi appears in Euler's famous identity: e^(iπ) + 1 = 0.",
            "The digits of pi pass all known tests for statistical randomness.",
            "Ramanujan discovered remarkable formulas for pi in the early 20th century, some still used today.",
            // 00:20 - Fact 20-39
            "Pi is used in Fourier transforms, which underpin digital audio and image compression.",
            "The Great Pyramid of Giza has a perimeter-to-height ratio close to 2π.",
            "Pi appears in Heisenberg's uncertainty principle in quantum mechanics.",
            "The first computer calculation of pi was performed in 1949 using ENIAC — 2,037 digits in 70 hours.",
            "Pi is intimately connected to the geometry of circles, spheres, and all curved surfaces.",
            "The Chudnovsky brothers calculated 4 billion digits of pi on a homemade supercomputer in 1994.",
            "Pi is used to calculate the orbital periods of planets.",
            "There are no repeating patterns known in the digits of pi.",
            "Pi is hidden in the formula for Coulomb's Law, which describes the force between electric charges.",
            "The number 3.14159... was known as 'the constant of the circle' for centuries.",
            // 00:30
            "Pi appears in the formula for gravitational waves detected by LIGO.",
            "Memorizing pi digits is a competitive sport — the world record is over 70,000 digits.",
            "The Basel problem, solved by Euler in 1734, showed that 1 + 1/4 + 1/9 + ... = π²/6.",
            "Pi appears in the formula for the area of an ellipse: A = πab.",
            "The circumference of the Earth is approximately 2π × 6,371 km.",
            "Pi is used in signal processing to describe sine and cosine waves.",
            "The Leibniz formula for pi: π/4 = 1 - 1/3 + 1/5 - 1/7 + ... converges very slowly.",
            "Pi appears in Einstein's field equations of general relativity.",
            "The Indian mathematician Madhava calculated pi to 11 decimal places around 1400 AD.",
            "Pi is used in GPS calculations to determine positions on the curved surface of the Earth.",
            // 00:40
            "There are no occurrences of the sequence 123456 in the first million digits of pi.",
            "The Gaussian integral, used in probability, equals √π.",
            "Pi was first called 'π' because it is the first letter of 'periphery' and 'perimeter'.",
            "A rational approximation of pi, 355/113, is accurate to 6 decimal places.",
            "Pi shows up in the solution to the Buffon's needle problem in probability theory.",
            "The area of a circle of radius 1 is exactly π.",
            "Pi appears in the formula for the volume of a torus.",
            "Supercomputers have been used to calculate pi as a test of computing power and accuracy.",
            "The sequence 0123456789 first appears at position 17,387,594,880 in the digits of pi.",
            "Pi is used in antenna design, acoustic engineering, and electromagnetic theory.",
            // 00:50
            "The ratio of pi to e (Euler's number) is approximately 1.1557.",
            "Pi appears in the formula relating a pendulum's length to its period of oscillation.",
            "The Machin formula, discovered in 1706, was used to compute pi for centuries.",
            "Pi is used in the mathematical description of all circular and rotational motion.",
            "The digit sequence 999999 appears at position 762 in pi — known as the Feynman Point.",
            "Pi appears in Stirling's approximation for factorials.",
            "The 100th digit of pi is 9.",
            "Pi shows up in the formula for the surface area of a sphere: 4πr².",
            "Napoleon is rumored to have been interested in pi — though historians debate this.",
            "There are more digits of pi than there are atoms in the observable universe.",
            // 01:00 (fact 60)
            "Pi cannot be expressed as a fraction of two integers — this was proved by Lambert in 1761.",
            "The first 144 digits of pi add up to 666 — a fun coincidence for mathematicians.",
            "Pi appears in the Wallis product: π/2 = (2/1)(2/3)(4/3)(4/5)(6/5)(6/7)...",
            "The Egyptians approximated pi as (16/9)² ≈ 3.16 around 1650 BC.",
            "Pi shows up in the formula for black hole entropy in Hawking's thermodynamics.",
            "The digits of pi contain every possible finite number sequence — theoretically.",
            "Pi is used to calculate the resonant frequencies of musical instruments.",
            "Archimedes was the first to rigorously approximate pi using a 96-sided polygon.",
            "Pi appears in the formula for the deflection of starlight around massive objects.",
            "The number of seconds in a year is approximately π × 10^7.",
            // Add more facts as index grows - for now cycle through with fallback
        ];

        // Pad array to 1440 by cycling through available facts - no markers
        while (PI_FACTS.length < 1440) {
            PI_FACTS.push(PI_FACTS[PI_FACTS.length % 70]);
        }

        // Color palette for facts (24 colors, one per hour)
        const FACT_COLORS = [
            '#4A90E2', '#7B68EE', '#50C878', '#FF6B6B',
            '#4ECDC4', '#F5A623', '#E67E22', '#E74C3C',
            '#9B59B6', '#1ABC9C', '#3498DB', '#E91E63',
            '#2ECC71', '#F39C12', '#D35400', '#8E44AD',
            '#16A085', '#2980B9', '#C0392B', '#27AE60',
            '#D98880', '#85C1E9', '#A9DFBF', '#F9E79F'
        ];

        // Scroll animation state
        let scrollAnimation = null;

        function drawPerspectiveBox() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;

            const bx1 = vw * 0.25;
            const by1 = vh * 0.25;
            const bx2 = vw * 0.75;
            const by2 = vh * 0.75;

            const box = document.getElementById('box');
            box.innerHTML = '';

            // FIX: No stroke on trapezoids or back panel
            const sides = [
                // Top trapezoid - darkest
                { points: `0,0 ${vw},0 ${bx2},${by1} ${bx1},${by1}`, fill: 'url(#grad-top)' },
                // Bottom trapezoid - lightest
                { points: `0,${vh} ${vw},${vh} ${bx2},${by2} ${bx1},${by2}`, fill: 'url(#grad-bottom)' },
                // Left trapezoid - mid
                { points: `0,0 ${bx1},${by1} ${bx1},${by2} 0,${vh}`, fill: 'url(#grad-left)' },
                // Right trapezoid - mid
                { points: `${vw},0 ${bx2},${by1} ${bx2},${by2} ${vw},${vh}`, fill: 'url(#grad-right)' },
            ];

            sides.forEach(s => {
                const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                poly.setAttribute('points', s.points);
                poly.setAttribute('fill', s.fill);
                poly.setAttribute('stroke', 'none'); // FIX: no outline
                box.appendChild(poly);
            });

            // Back panel - no stroke
            const back = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            back.setAttribute('x', bx1);
            back.setAttribute('y', by1);
            back.setAttribute('width', vw * 0.5);
            back.setAttribute('height', vh * 0.5);
            back.setAttribute('fill', '#c8c8c8');
            back.setAttribute('stroke', 'none'); // FIX: no outline
            box.appendChild(back);
        }

        function drawPiSymbol() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;

            const piGroup = document.getElementById('pi-symbol');
            piGroup.innerHTML = '';

            // Large π text centered on screen
            // Size: 70% of viewport height so it dominates behind the ribbon
            const fontSize = vh * 0.7 * 0.75;

            const piText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            piText.setAttribute('x', vw / 2);
            piText.setAttribute('y', (vh / 2) - (fontSize * 0.15));
            piText.setAttribute('text-anchor', 'middle');
            piText.setAttribute('dominant-baseline', 'central');
            piText.setAttribute('font-family', 'Georgia, "Times New Roman", serif');
            piText.setAttribute('font-size', fontSize);
            piText.setAttribute('font-weight', 'bold');
            piText.setAttribute('fill', '#555555');
            piText.setAttribute('opacity', '0.40');
            piText.textContent = 'π';

            piGroup.appendChild(piText);
        }

        function drawPieClock() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const isPortrait = vh > vw;

            const backPanelWidth = vw * 0.5;
            const backPanelHeight = vh * 0.5;

            let circleDiameter = isPortrait ? backPanelHeight * 1.1 : backPanelWidth * 1.1;
            const radius = circleDiameter / 2;
            const cx = vw / 2;
            const cy = vh / 2;

            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();

            const totalMinutes = ((hours % 12) * 60) + minutes;
            const angle = (totalMinutes / 720) * 360;

            const isAM = hours < 12;
            const bgColor = isAM ? '#111111' : '#f5f5f5';
            const sliceColor = isAM ? '#f5f5f5' : '#111111';

            const pie = document.getElementById('pie');
            pie.innerHTML = '';

            // Background circle - no stroke
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            bg.setAttribute('cx', cx);
            bg.setAttribute('cy', cy);
            bg.setAttribute('r', radius);
            bg.setAttribute('fill', bgColor);
            bg.setAttribute('stroke', 'none');
            pie.appendChild(bg);

            if (angle > 0 && angle < 360) {
                const startRad = (-90 * Math.PI) / 180;
                const endRad = ((-90 + angle) * Math.PI) / 180;

                const x1 = cx + radius * Math.cos(startRad);
                const y1 = cy + radius * Math.sin(startRad);
                const x2 = cx + radius * Math.cos(endRad);
                const y2 = cy + radius * Math.sin(endRad);
                const largeArc = angle > 180 ? 1 : 0;

                const slice = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                slice.setAttribute('d', `M ${cx},${cy} L ${x1},${y1} A ${radius},${radius} 0 ${largeArc},1 ${x2},${y2} Z`);
                slice.setAttribute('fill', sliceColor);
                pie.appendChild(slice);
            }
        }

        function startScroll(text, color) {
            const el = document.getElementById('fact-text');
            const container = el.parentElement;

            el.textContent = text;
            el.style.color = color;

            // Cancel any running animation
            if (scrollAnimation) {
                cancelAnimationFrame(scrollAnimation);
                scrollAnimation = null;
            }

            // Wait for text to render, then measure and animate
            requestAnimationFrame(() => {
                const textWidth = el.offsetWidth;
                const containerWidth = container.offsetWidth;

                // Total travel = start at right edge to end fully off left edge
                const startX = containerWidth;
                const endX = -textWidth;
                const totalDistance = startX - endX;

                // FIX: 30 seconds for one complete pass (double speed)
                const duration = 30000;
                const startTime = performance.now();

                function animate(now) {
                    const elapsed = now - startTime;
                    const progress = elapsed / duration;

                    if (progress >= 1) {
                        // One pass complete - restart with fresh fact check
                        updateFact();
                        return;
                    }

                    const x = startX - (progress * totalDistance);
                    el.style.transform = `translateX(${x}px)`;
                    scrollAnimation = requestAnimationFrame(animate);
                }

                scrollAnimation = requestAnimationFrame(animate);
            });
        }

        function updateFact() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const hh = String(hours).padStart(2, '0');
            const mm = String(minutes).padStart(2, '0');

            // FIX: fact number = total minutes since midnight
            const factIndex = hours * 60 + minutes; // 0-1439
            const fact = PI_FACTS[factIndex] || "Pi has been calculated to over 100 trillion digits.";

            // FIX: Color based on hour (24 hour palette)
            const color = FACT_COLORS[hours % 24];

            // FIX: More space between time and fact text
            const factText = `${hh}:${mm}          FACT #${factIndex}:  ${fact.toUpperCase()}               `;

            startScroll(factText, color);
        }

        function init() {
            drawPerspectiveBox();
            drawPiSymbol();
            drawPieClock();
            updateFact();
        }

        init();

        // Update pie every second
        setInterval(drawPieClock, 1000);

        // Redraw box on resize
        window.addEventListener('resize', init);
    </script>
</body>
</html>
